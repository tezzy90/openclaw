# OpenClaw Production Docker Compose (Uses Official Latest Image)
#
# This compose file pulls the OFFICIAL OpenClaw Docker image from GitHub
# Container Registry, so you always get the latest stable release —
# independent of this fork's source code version.
#
# Usage:
#   cp .env.production.example .env
#   # Edit .env with your API keys and tokens
#   docker compose -f docker-compose.prod.yml pull     # get latest
#   docker compose -f docker-compose.prod.yml up -d
#
# To upgrade to a new release:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Services:
#   - openclaw-gateway: Always-on AI gateway (core) - port 18789
#   - openclaw-cli:     On-demand CLI for management
#   - openclaw-browser: Headless browser sandbox with VNC (optional, port 6080)

services:
  # ─── Core Gateway ─────────────────────────────────────────────
  openclaw-gateway:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    container_name: openclaw-gateway
    pull_policy: always
    environment:
      HOME: /home/node
      TERM: xterm-256color
      NODE_ENV: production

      # Gateway auth
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}

      # Model provider keys - set at least one in .env
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}

      # Channel tokens
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}

      # Tools
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}

      # Ollama (if running on host)
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
    volumes:
      # Persistent config and workspace
      - openclaw-config:/home/node/.openclaw
      - openclaw-workspace:/home/node/.openclaw/workspace
    ports:
      - "${OPENCLAW_GATEWAY_PORT:-18789}:18789"
      - "${OPENCLAW_BRIDGE_PORT:-18790}:18790"
    restart: unless-stopped
    init: true
    extra_hosts:
      # Allow container to reach Ollama running on the host (Mac/Linux)
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "node", "dist/index.js", "health", "--token", "${OPENCLAW_GATEWAY_TOKEN}"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    command:
      [
        "node", "dist/index.js", "gateway",
        "--bind", "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port", "18789",
      ]
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

  # ─── CLI (on-demand, for management commands) ────────────────
  openclaw-cli:
    image: ${OPENCLAW_IMAGE:-ghcr.io/openclaw/openclaw:latest}
    container_name: openclaw-cli
    profiles: ["cli"]
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      BROWSER: echo
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - openclaw-config:/home/node/.openclaw
      - openclaw-workspace:/home/node/.openclaw/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]

  # ─── Browser Sandbox (optional, for visual debugging) ────────
  openclaw-browser:
    image: ${OPENCLAW_BROWSER_IMAGE:-ghcr.io/openclaw/openclaw-sandbox-browser:latest}
    container_name: openclaw-browser
    profiles: ["browser"]
    pull_policy: always
    ports:
      - "${OPENCLAW_BROWSER_CDP_PORT:-9222}:9222"
      - "${OPENCLAW_BROWSER_NOVNC_PORT:-6080}:6080"
    environment:
      OPENCLAW_BROWSER_HEADLESS: "0"
      OPENCLAW_BROWSER_ENABLE_NOVNC: "1"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  openclaw-config:
    name: openclaw-config
  openclaw-workspace:
    name: openclaw-workspace
